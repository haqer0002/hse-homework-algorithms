<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc">
<title id="title">Validate BST: ограничения от предков</title>
<desc id="desc">Узлы проверяются в порядке 10, 5, 2, 12. Последний узел не входит в открытый диапазон (5, 10). Ответ False. Замена на 7 даёт True.</desc>
<rect width="1000" height="1120" fill="white"/>
<text x="40" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d" text-anchor="start">Validate BST: ограничения от предков</text>
<text x="40" y="91" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start">Каждый узел должен входить в открытый диапазон допустимых значений.</text>
<rect x="40" y="117" width="920" height="403" rx="12" fill="#f7f9fc"/>
<text x="62" y="151" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d" text-anchor="start">Узел 12 находится в левом поддереве 10.</text>
<line x1="477.3319722027873" y1="220.5432687428896" x2="307.6680277972127" y2="299.4567312571104" stroke="#914700" stroke-width="3"/>
<line x1="522.6680277972126" y1="220.5432687428896" x2="692.3319722027874" y2="299.4567312571104" stroke="#cbd5e1" stroke-width="3"/>
<line x1="266.5014981651014" y1="326.8168198499078" x2="193.4985018348986" y2="393.1831801500922" stroke="#cbd5e1" stroke-width="3"/>
<line x1="303.4985018348986" y1="326.8168198499078" x2="376.5014981651014" y2="393.1831801500922" stroke="#914700" stroke-width="3"/>
<line x1="696.5014981651015" y1="326.8168198499078" x2="623.4985018348985" y2="393.1831801500922" stroke="#cbd5e1" stroke-width="3"/>
<line x1="733.4985018348985" y1="326.8168198499078" x2="806.5014981651015" y2="393.1831801500922" stroke="#cbd5e1" stroke-width="3"/>
<circle cx="500" cy="210" r="25" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="218" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="middle">10</text>
<circle cx="526" cy="187" r="10" fill="#1d4ed8"/>
<text x="526" y="191" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">1</text>
<circle cx="285" cy="310" r="25" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="285" y="318" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="middle">5</text>
<circle cx="311" cy="287" r="10" fill="#1d4ed8"/>
<text x="311" y="291" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">2</text>
<circle cx="715" cy="310" r="25" fill="#e9edf2" stroke="#7b8798" stroke-width="1.5"/>
<text x="715" y="318" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7b8798" text-anchor="middle">15</text>
<circle cx="175" cy="410" r="25" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="175" y="418" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="middle">2</text>
<circle cx="201" cy="387" r="10" fill="#1d4ed8"/>
<text x="201" y="391" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">3</text>
<circle cx="395" cy="410" r="25" fill="#fdebed" stroke="#a32936" stroke-width="1.5"/>
<text x="395" y="418" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#a32936" text-anchor="middle">12</text>
<circle cx="421" cy="387" r="10" fill="#a32936"/>
<text x="421" y="391" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">4</text>
<circle cx="605" cy="410" r="25" fill="#e9edf2" stroke="#7b8798" stroke-width="1.5"/>
<text x="605" y="418" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7b8798" text-anchor="middle">11</text>
<circle cx="825" cy="410" r="25" fill="#e9edf2" stroke="#7b8798" stroke-width="1.5"/>
<text x="825" y="418" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7b8798" text-anchor="middle">20</text>
<text x="395" y="460" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a32936" text-anchor="middle">нужно: 5 &lt; 12 &lt; 10</text>
<text x="62" y="496" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start">Серые узлы не проверяются: алгоритм уже вернул False.</text>
<text x="40" y="566" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">Проверки в порядке извлечения из стека</text>
<rect x="40" y="593" width="920" height="42" rx="0" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="620" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#52627a" text-anchor="middle">Шаг</text>
<text x="180.0" y="620" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#52627a" text-anchor="middle">Узел</text>
<text x="380.0" y="620" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#52627a" text-anchor="middle">Диапазон (строго)</text>
<text x="740.0" y="620" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#52627a" text-anchor="middle">Результат</text>
<rect x="40" y="635" width="920" height="58" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="671.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">1</text>
<text x="180.0" y="671.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">10</text>
<text x="380.0" y="671.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">(−∞, +∞)</text>
<text x="740.0" y="671.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">проходит</text>
<rect x="40" y="693" width="920" height="58" rx="0" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="729.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">2</text>
<text x="180.0" y="729.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">5</text>
<text x="380.0" y="729.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">(−∞, 10)</text>
<text x="740.0" y="729.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">проходит</text>
<rect x="40" y="751" width="920" height="58" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="787.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">3</text>
<text x="180.0" y="787.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">2</text>
<text x="380.0" y="787.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">(−∞, 5)</text>
<text x="740.0" y="787.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">проходит</text>
<rect x="40" y="809" width="920" height="58" rx="0" fill="#fdebed" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="845.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#a32936" text-anchor="middle">4</text>
<text x="180.0" y="845.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#a32936" text-anchor="middle">12</text>
<text x="380.0" y="845.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#a32936" text-anchor="middle">(5, 10)</text>
<text x="740.0" y="845.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#a32936" text-anchor="middle">12 ≥ 10 → False</text>
<text x="40" y="898" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start">±∞ на схеме — отсутствие границы (None в коде).</text>
<rect x="40" y="925" width="920" height="150" rx="12" fill="#e7f5ef"/>
<text x="62" y="960" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#11654f" text-anchor="start">Если заменить 12 на 7, дерево станет корректным BST.</text>
<text x="62" y="996" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">Порядок проверок: 10 → 5 → 2 → 7 → 15 → 11 → 20.</text>
<text x="62" y="1036" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#11654f" text-anchor="start">Все значения входят в свои диапазоны → True.</text>
</svg>
