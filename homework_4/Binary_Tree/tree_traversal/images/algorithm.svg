<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img" aria-labelledby="title desc">
<title id="title">BST: вставка и шесть обходов</title>
<desc id="desc">Вставка 13 по пути 8, 10, 14. Таблица показывает значения на шагах 1–10 всех шести обходов. Reverse означает правое поддерево раньше левого.</desc>
<rect width="1000" height="1300" fill="white"/>
<text x="40" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d" text-anchor="start">BST: вставка и шесть обходов</text>
<text x="40" y="91" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start">Исходные ключи: 8, 3, 10, 1, 6, 9, 14, 4, 7. Вставляем 13.</text>
<rect x="40" y="117" width="920" height="445" rx="12" fill="#f7f9fc"/>
<text x="62" y="151" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d" text-anchor="start">1. 13 &gt; 8 → вправо; 13 &gt; 10 → вправо; 13 &lt; 14 → влево</text>
<text x="62" y="181" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start">Оранжевым — путь поиска. На пустом месте создаём узел 13.</text>
