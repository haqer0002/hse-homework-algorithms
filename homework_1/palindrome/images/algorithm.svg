<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1064" viewBox="0 0 1000 1064" role="img" aria-labelledby="title desc">
<title id="title">Палиндром: разворачиваем цифры</title>
<desc id="desc">Пять шагов проверки числа 12021. На каждом шаге последняя цифра остатка добавляется справа к развёрнутой части. Остатки: 1202, 120, 12, 1, 0. Развёрнутые части: 1, 12, 120, 1202, 12021. В конце 12021 равно исходному числу: True.</desc>
