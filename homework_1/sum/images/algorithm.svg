<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="846" viewBox="0 0 1000 846" role="img" aria-labelledby="title desc">
<title id="title">Максимальная чётная сумма</title>
<desc id="desc">Массив 9, 4, 3, 8, 5 обрабатывается слева направо. Сумма меняется: 9, 13, 16, 24, 29; минимальное нечётное: 9, 9, 3, 3, 3. Сумма 29 нечётна, поэтому исключаем минимальное нечётное число 3. 9 + 4 + 8 + 5 = 26.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#637185"/></marker></defs>
<rect x="0" y="0" width="1000" height="846" rx="0" fill="#ffffff"/>
<text x="40" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d" text-anchor="start">Максимальная чётная сумма</text>
<text x="40" y="91" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start">Пример: 9, 4, 3, 8, 5. За один проход считаем сумму и минимум среди нечётных.</text>
<rect x="40" y="117" width="920" height="57" rx="12" fill="#f7f9fc"/>
<text x="61" y="153" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#172b4d" text-anchor="start">Начало: total = 0, min_odd = None</text>
<text x="40" y="211" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start">Читаем слева направо. Состояние показано после добавления элемента.</text>
<rect x="40" y="235" width="172" height="233" rx="12" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="56" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">Шаг 1</text>
<text x="56" y="308" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">+ 9</text>
<line x1="56" y1="327" x2="196" y2="327" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="56" y="354" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">total</text>
<text x="190" y="357" font-family="Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#1d4ed8" text-anchor="end">9</text>
<rect x="50" y="380" width="152" height="42" rx="7" fill="#fff0cf"/>
<text x="57" y="407" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#914700" text-anchor="start">min_odd</text>
<text x="190" y="409" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#914700" text-anchor="end">9</text>
<text x="56" y="447" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#914700" text-anchor="start">новый минимум</text>
<line x1="214" y1="297" x2="225" y2="297" stroke="#637185" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="227" y="235" width="172" height="233" rx="12" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="243" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">Шаг 2</text>
<text x="243" y="308" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">+ 4</text>
<line x1="243" y1="327" x2="383" y2="327" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="243" y="354" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">total</text>
<text x="377" y="357" font-family="Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#1d4ed8" text-anchor="end">13</text>
<rect x="237" y="380" width="152" height="42" rx="7" fill="#ffffff"/>
<text x="244" y="407" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">min_odd</text>
<text x="377" y="409" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#172b4d" text-anchor="end">9</text>
<text x="243" y="447" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52627a" text-anchor="start">минимум прежний</text>
<line x1="401" y1="297" x2="412" y2="297" stroke="#637185" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="414" y="235" width="172" height="233" rx="12" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="430" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">Шаг 3</text>
<text x="430" y="308" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">+ 3</text>
<line x1="430" y1="327" x2="570" y2="327" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430" y="354" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">total</text>
<text x="564" y="357" font-family="Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#1d4ed8" text-anchor="end">16</text>
<rect x="424" y="380" width="152" height="42" rx="7" fill="#fff0cf"/>
<text x="431" y="407" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#914700" text-anchor="start">min_odd</text>
<text x="564" y="409" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#914700" text-anchor="end">3</text>
<text x="430" y="447" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#914700" text-anchor="start">новый минимум</text>
<line x1="588" y1="297" x2="599" y2="297" stroke="#637185" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="601" y="235" width="172" height="233" rx="12" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="617" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">Шаг 4</text>
<text x="617" y="308" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">+ 8</text>
<line x1="617" y1="327" x2="757" y2="327" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="617" y="354" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">total</text>
<text x="751" y="357" font-family="Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#1d4ed8" text-anchor="end">24</text>
<rect x="611" y="380" width="152" height="42" rx="7" fill="#ffffff"/>
<text x="618" y="407" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">min_odd</text>
<text x="751" y="409" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#172b4d" text-anchor="end">3</text>
<text x="617" y="447" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52627a" text-anchor="start">минимум прежний</text>
<line x1="775" y1="297" x2="786" y2="297" stroke="#637185" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="788" y="235" width="172" height="233" rx="12" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="804" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">Шаг 5</text>
<text x="804" y="308" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">+ 5</text>
<line x1="804" y1="327" x2="944" y2="327" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="804" y="354" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">total</text>
<text x="938" y="357" font-family="Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#1d4ed8" text-anchor="end">29</text>
<rect x="798" y="380" width="152" height="42" rx="7" fill="#ffffff"/>
<text x="805" y="407" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">min_odd</text>
<text x="938" y="409" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#172b4d" text-anchor="end">3</text>
<text x="804" y="447" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52627a" text-anchor="start">минимум прежний</text>
<line x1="872" y1="470" x2="872" y2="492" stroke="#637185" stroke-width="1.5"/>
<line x1="872" y1="492" x2="250" y2="492" stroke="#637185" stroke-width="1.5"/>
<line x1="250" y1="492" x2="250" y2="509" stroke="#637185" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="517" width="420" height="100" rx="12" fill="#fff0cf"/>
<text x="61" y="550" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#914700" text-anchor="start">Проверяем чётность</text>
<text x="61" y="588" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#914700" text-anchor="start">29 % 2 = 1 → сумма нечётная</text>
<line x1="474" y1="566" x2="524" y2="566" stroke="#637185" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540" y="517" width="420" height="100" rx="12" fill="#e7f5ef"/>
<text x="561" y="550" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#11654f" text-anchor="start">Вычитаем минимальное нечётное</text>
<text x="561" y="588" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#11654f" text-anchor="start">29 − 3 = 26</text>
<text x="40" y="662" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d" text-anchor="start">Выбор элементов: исключаем только 3</text>
<rect x="40" y="686" width="80" height="62" rx="9" fill="#e7f5ef"/>
<text x="80" y="726" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#11654f" text-anchor="middle">9</text>
<text x="145" y="727" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52627a" text-anchor="middle">+</text>
<rect x="170" y="686" width="80" height="62" rx="9" fill="#e7f5ef"/>
<text x="210" y="726" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#11654f" text-anchor="middle">4</text>
<text x="275" y="727" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52627a" text-anchor="middle">+</text>
<rect x="300" y="686" width="80" height="62" rx="9" fill="#fff0f0"/>
<text x="340" y="726" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#b42332" text-anchor="middle">3</text>
<line x1="318" y1="738" x2="362" y2="697" stroke="#b42332" stroke-width="2.5"/>
<text x="340" y="775" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b42332" text-anchor="middle">исключаем</text>
<text x="405" y="727" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52627a" text-anchor="middle">+</text>
<rect x="430" y="686" width="80" height="62" rx="9" fill="#e7f5ef"/>
<text x="470" y="726" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#11654f" text-anchor="middle">8</text>
<text x="535" y="727" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52627a" text-anchor="middle">+</text>
<rect x="560" y="686" width="80" height="62" rx="9" fill="#e7f5ef"/>
<text x="600" y="726" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#11654f" text-anchor="middle">5</text>
<text x="695" y="729" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#637185" text-anchor="start">→</text>
<text x="750" y="730" font-family="Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="#11654f" text-anchor="start">26</text>
<text x="40" y="816" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start">Все числа положительные: удаление минимального нечётного даёт наименьшую потерю.</text>
</svg>
