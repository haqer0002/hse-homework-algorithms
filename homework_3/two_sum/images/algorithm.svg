<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Two sum: поиск пары индексов</title>
<desc id="desc">arr: 8, -2, 11, 4, 7; k = 5. Для каждого элемента показаны дополнение и словарь до проверки. Дополнения: -3, 7, -6, 1, -2. На индексе 4 находим -2, сохранённое с индексом 1. Ответ: 1 4.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#637185"/></marker></defs>
<rect x="0" y="0" width="1000" height="1060" rx="0" fill="#ffffff"/>
<text x="40" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d" text-anchor="start">Two sum: поиск пары индексов</text>
<text x="40" y="91" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#52627a" text-anchor="start">arr = [8, -2, 11, 4, 7], k = 5. Индексы считаем от 0.</text>
<rect x="40" y="117" width="920" height="57" rx="12" fill="#f7f9fc"/>
<text x="61" y="152" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172b4d" text-anchor="start">Сначала ищем k − arr[i] среди уже просмотренных чисел.</text>
<text x="40" y="204" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start">seen хранит пары «значение: индекс». На схеме — состояние до проверки.</text>
<rect x="40" y="224" width="920" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="61" y="253" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d" text-anchor="start">Шаг 1: i = 0, arr[i] = 8</text>
<text x="61" y="284" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1d4ed8" text-anchor="start">Нужно: 5 − 8 = -3</text>
<text x="61" y="318" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start">Не найдено → запоминаем 8: 0.</text>
<text x="532" y="250" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">seen до проверки</text>
<text x="532" y="297" font-family="Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#52627a" text-anchor="start">{}</text>
<rect x="40" y="350" width="920" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="61" y="379" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d" text-anchor="start">Шаг 2: i = 1, arr[i] = -2</text>
<text x="61" y="410" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1d4ed8" text-anchor="start">Нужно: 5 − (-2) = 7</text>
<text x="61" y="444" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start">Не найдено → запоминаем -2: 1.</text>
<text x="532" y="376" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">seen до проверки</text>
<rect x="532" y="390" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="612" y="412" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">8: 0</text>
<rect x="40" y="476" width="920" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="61" y="505" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d" text-anchor="start">Шаг 3: i = 2, arr[i] = 11</text>
<text x="61" y="536" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1d4ed8" text-anchor="start">Нужно: 5 − 11 = -6</text>
<text x="61" y="570" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start">Не найдено → запоминаем 11: 2.</text>
<text x="532" y="502" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">seen до проверки</text>
<rect x="532" y="516" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="612" y="538" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">8: 0</text>
<rect x="710" y="516" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="790" y="538" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">-2: 1</text>
<rect x="40" y="602" width="920" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="61" y="631" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d" text-anchor="start">Шаг 4: i = 3, arr[i] = 4</text>
<text x="61" y="662" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#1d4ed8" text-anchor="start">Нужно: 5 − 4 = 1</text>
<text x="61" y="696" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start">Не найдено → запоминаем 4: 3.</text>
<text x="532" y="628" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">seen до проверки</text>
<rect x="532" y="642" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="612" y="664" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">8: 0</text>
<rect x="710" y="642" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="790" y="664" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">-2: 1</text>
<rect x="532" y="679" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="612" y="701" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">11: 2</text>
<rect x="40" y="728" width="920" height="116" rx="12" fill="#e7f5ef" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="61" y="757" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d" text-anchor="start">Шаг 5: i = 4, arr[i] = 7</text>
<text x="61" y="788" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#11654f" text-anchor="start">Нужно: 5 − 7 = -2</text>
<text x="61" y="813" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#11654f" text-anchor="start">Есть -2 с индексом 1.</text>
<text x="61" y="835" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#11654f" text-anchor="start">Возвращаем 1 4.</text>
<text x="532" y="754" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="start">seen до проверки</text>
<rect x="532" y="768" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="612" y="790" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">8: 0</text>
<rect x="710" y="768" width="160" height="30" rx="6" fill="#fff0cf"/>
<text x="790" y="790" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#914700" text-anchor="middle">-2: 1</text>
<rect x="532" y="805" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="612" y="827" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">11: 2</text>
<rect x="710" y="805" width="160" height="30" rx="6" fill="#edf4ff"/>
<text x="790" y="827" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">4: 3</text>
<text x="40" y="884" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start">Число 7 не добавляем в seen: пара уже найдена.</text>
<rect x="40" y="908" width="920" height="112" rx="12" fill="#e7f5ef"/>
<text x="61" y="947" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#11654f" text-anchor="start">arr[1] + arr[4] = -2 + 7 = 5</text>
<text x="61" y="990" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#11654f" text-anchor="start">Ответ: 1 4</text>
</svg>
