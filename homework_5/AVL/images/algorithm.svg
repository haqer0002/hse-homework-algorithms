<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1480" viewBox="0 0 1000 1480" role="img" aria-labelledby="title desc">
<title id="title">AVL: вставка, удаление и поиск</title>
<desc id="desc">Вставка 15 в дерево 30,10,40,5,20 вызывает поворот влево у 10, затем вправо у 30. После удаления 5,15,10 поворот влево у 20 меняет корень на 30. Поиск 40 успешен, 15 отсутствует.</desc>
<rect width="1000" height="1480" fill="white"/>
<text x="40" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">AVL: вставка, удаление и поиск</text>
<text x="40" y="91" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">Баланс B = hL − hR. Допустимые значения: −1, 0, 1.</text>
<rect x="40" y="117" width="920" height="470" rx="12" fill="#f7f9fc"/>
<text x="62" y="153" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">1. Вставляем 15: LR-перекос</text>
<text x="62" y="184" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">Начальные ключи: 30, 10, 40, 5, 20. Показаны состояния внутри вставки.</text>
<text x="190" y="222" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">До поворотов</text>
<text x="500" y="222" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">Влево у 10</text>
<text x="810" y="222" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">Вправо у 30</text>
