<circle cx="705" cy="435" r="22" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="705" y="442" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">5</text>
