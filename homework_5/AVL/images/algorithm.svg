<text x="775" y="442" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">15</text>
<circle cx="920" cy="435" r="22" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="920" y="442" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">40</text>
<text x="190" y="565" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a32936" text-anchor="middle" xml:space="preserve">B(30) = +2; B(10) = −1</text>
<text x="500" y="565" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#52627a" text-anchor="middle" xml:space="preserve">Промежуточное состояние</text>
<text x="810" y="565" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#11654f" text-anchor="middle" xml:space="preserve">Корень 20, высота 3</text>
<rect x="40" y="614" width="920" height="440" rx="12" fill="#f7f9fc"/>
<text x="62" y="649" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">2. Удаляем 5, 15, затем 10: одиночный поворот</text>
<text x="62" y="680" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">После удаления 10 левое поддерево пусто, правое имеет высоту 2.</text>
<text x="190" y="722" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">Перед удалением 10</text>
