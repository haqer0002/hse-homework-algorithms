<text x="740" y="362" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">10</text>
<circle cx="880" cy="355" r="22" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.5"/>
