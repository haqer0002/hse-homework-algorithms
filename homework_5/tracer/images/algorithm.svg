<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="title desc">
<title id="title">Tracer: входы и возвраты рекурсии</title>
<desc id="desc">Вызовы factorial(4), factorial(3), factorial(2), factorial(1). Возвраты с результатами 1, 2, 6 и 24. Отступ равен двум пробелам на уровень.</desc>
<rect width="1000" height="1190" fill="white"/>
<text x="40" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">Tracer: входы и возвраты рекурсии</text>
<text x="40" y="91" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">Отступ = 2 пробела × глубина. Вход и возврат на одном уровне.</text>
<rect x="40" y="117" width="920" height="430" rx="12" fill="#f7f9fc"/>
<text x="62" y="153" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">Дерево вызовов</text>
<text x="520" y="153" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">Настоящий вывод декоратора</text>
<line x1="195" y1="234" x2="230" y2="270" stroke="#cbd5e1" stroke-width="2.5"/>
<line x1="230" y1="314" x2="265" y2="350" stroke="#cbd5e1" stroke-width="2.5"/>
<line x1="265" y1="394" x2="300" y2="430" stroke="#cbd5e1" stroke-width="2.5"/>
<rect x="80" y="190" width="230" height="44" rx="8" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="195" y="219" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">factorial(4)</text>
<text x="445" y="219" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#11654f" text-anchor="middle" xml:space="preserve">= 24</text>
<rect x="115" y="270" width="230" height="44" rx="8" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="230" y="299" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">factorial(3)</text>
<text x="445" y="299" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#11654f" text-anchor="middle" xml:space="preserve">= 6</text>
<rect x="150" y="350" width="230" height="44" rx="8" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="265" y="379" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">factorial(2)</text>
<text x="445" y="379" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#11654f" text-anchor="middle" xml:space="preserve">= 2</text>
<rect x="185" y="430" width="230" height="44" rx="8" fill="#edf4ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="300" y="459" font-family="Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">factorial(1)</text>
<text x="445" y="459" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#11654f" text-anchor="middle" xml:space="preserve">= 1</text>
<rect x="505" y="181" width="433" height="319" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="522" y="218" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">-&gt; factorial(4)</text>
<text x="522" y="252" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">  -&gt; factorial(3)</text>
<text x="522" y="286" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">    -&gt; factorial(2)</text>
<text x="522" y="320" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">      -&gt; factorial(1)</text>
<text x="522" y="354" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">      &lt;- factorial = 1</text>
<text x="522" y="388" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">    &lt;- factorial = 2</text>
<text x="522" y="422" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">  &lt;- factorial = 6</text>
<text x="522" y="456" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">&lt;- factorial = 24</text>
<text x="62" y="523" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">Справа от вызовов указаны результаты при возврате.</text>
<text x="40" y="590" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">Стек после каждого входа или завершения вызова</text>
<rect x="40" y="615" width="920" height="42" rx="0" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="642" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#52627a" text-anchor="middle" xml:space="preserve">Шаг</text>
<text x="300.0" y="642" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#52627a" text-anchor="middle" xml:space="preserve">Стек (значения n)</text>
<text x="720.0" y="642" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#52627a" text-anchor="middle" xml:space="preserve">Действие / результат</text>
<rect x="40" y="657" width="920" height="48" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="688.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">1</text>
<text x="300.0" y="688.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">[4]</text>
<text x="720.0" y="688.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">вызов factorial(4)</text>
<rect x="40" y="705" width="920" height="48" rx="0" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="736.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">2</text>
<text x="300.0" y="736.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">[4, 3]</text>
<text x="720.0" y="736.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">вызов factorial(3)</text>
<rect x="40" y="753" width="920" height="48" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="784.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">3</text>
<text x="300.0" y="784.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">[4, 3, 2]</text>
<text x="720.0" y="784.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">вызов factorial(2)</text>
<rect x="40" y="801" width="920" height="48" rx="0" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="832.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">4</text>
<text x="300.0" y="832.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">[4, 3, 2, 1]</text>
<text x="720.0" y="832.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">вызов factorial(1)</text>
<rect x="40" y="849" width="920" height="48" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="880.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">5</text>
<text x="300.0" y="880.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">[4, 3, 2]</text>
<text x="720.0" y="880.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">возврат 1</text>
<rect x="40" y="897" width="920" height="48" rx="0" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="928.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">6</text>
<text x="300.0" y="928.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">[4, 3]</text>
<text x="720.0" y="928.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">возврат 2</text>
<rect x="40" y="945" width="920" height="48" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="976.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">7</text>
<text x="300.0" y="976.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">[4]</text>
<text x="720.0" y="976.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172b4d" text-anchor="middle" xml:space="preserve">возврат 6</text>
<rect x="40" y="993" width="920" height="48" rx="0" fill="#e7f5ef" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="80.0" y="1024.0" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#11654f" text-anchor="middle" xml:space="preserve">8</text>
<text x="300.0" y="1024.0" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#11654f" text-anchor="middle" xml:space="preserve">[]</text>
<text x="720.0" y="1024.0" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#11654f" text-anchor="middle" xml:space="preserve">возврат 24</text>
<rect x="40" y="1070" width="920" height="75" rx="12" fill="#e7f5ef"/>
<text x="62" y="1119" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#11654f" text-anchor="start" xml:space="preserve">factorial(4) = 4 × 3 × 2 × 1 = 24</text>
</svg>
