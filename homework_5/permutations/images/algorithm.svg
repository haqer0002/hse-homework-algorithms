<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450" role="img" aria-labelledby="title desc">
<title id="title">Permutations: дерево перебора и стек</title>
<desc id="desc">Все шестнадцать вызовов backtrack для [1,2,3]. Шесть листьев дают перестановки. Фрагмент настоящей трассы показывает первую ветвь.</desc>
<rect width="1000" height="1450" fill="white"/>
<text x="40" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">Permutations: дерево перебора и стек</text>
<text x="40" y="91" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">nums = [1, 2, 3]; remaining = {1: 1, 2: 1, 3: 1}</text>
<rect x="40" y="117" width="920" height="520" rx="12" fill="#f7f9fc"/>
<text x="62" y="153" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">1. Дерево рекурсивных вызовов backtrack(path)</text>
<text x="62" y="183" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">Маленький номер – порядок входа. Зелёным отмечены готовые перестановки.</text>
