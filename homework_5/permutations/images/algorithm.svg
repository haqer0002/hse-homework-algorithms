<text x="62" y="591" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">В листе сохраняем path.copy(). После возврата отменяем последний выбор.</text>
<rect x="40" y="666" width="920" height="460" rx="12" fill="#f7f9fc"/>
<text x="62" y="703" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b4d" text-anchor="start" xml:space="preserve">2. Фрагмент вывода: ветвь, начинающаяся с 1</text>
<rect x="62" y="723" width="876" height="352" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="82" y="756" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">-&gt; backtrack([])</text>
<text x="82" y="785" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">  -&gt; backtrack([1])</text>
<text x="82" y="814" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">    -&gt; backtrack([1, 2])</text>
<text x="82" y="843" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">      -&gt; backtrack([1, 2, 3])</text>
<text x="82" y="872" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">      &lt;- backtrack = None</text>
<text x="82" y="901" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">    &lt;- backtrack = None</text>
<text x="82" y="930" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">    -&gt; backtrack([1, 3])</text>
<text x="82" y="959" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1d4ed8" text-anchor="start" xml:space="preserve">      -&gt; backtrack([1, 3, 2])</text>
<text x="82" y="988" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">      &lt;- backtrack = None</text>
<text x="82" y="1017" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">    &lt;- backtrack = None</text>
<text x="82" y="1046" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">  &lt;- backtrack = None</text>
<text x="62" y="1106" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">backtrack записывает ответы в result, поэтому возвращает None.</text>
<rect x="40" y="1155" width="920" height="177" rx="12" fill="#e7f5ef"/>
<text x="62" y="1193" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#11654f" text-anchor="start" xml:space="preserve">3. Итоговый список permutations([1, 2, 3])</text>
<text x="62" y="1238" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve">[[1, 2, 3], [1, 3, 2], [2, 1, 3],</text>
<text x="62" y="1276" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#11654f" text-anchor="start" xml:space="preserve"> [2, 3, 1], [3, 1, 2], [3, 2, 1]]</text>
<text x="40" y="1384" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52627a" text-anchor="start" xml:space="preserve">Стек вызовов показан декоратором из первой задачи; порядок листьев – порядок ответа.</text>
</svg>
